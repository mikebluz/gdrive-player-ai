<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Path 1 probe</title>
<style>body{font:14px -apple-system,sans-serif;background:#111;color:#dfd;padding:12px}pre{white-space:pre-wrap;word-break:break-all}</style>
<h3>Path 1 — new phonemizer on WebKit. Results below; close when told.</h3><pre id="out">starting…
</pre>
<script type="module">
const out = document.getElementById('out');
const log = (o) => { out.textContent += JSON.stringify(o) + '\n';
  fetch('http://' + location.hostname + ':3002/log', { method: 'POST', mode: 'cors',
    headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t: Date.now(), ...o }) }).catch(() => {}); };
log({ ev: 'boot6', ua: navigator.userAgent.slice(-55) });
const w = new Worker(URL.createObjectURL(new Blob([`
  const t0 = Date.now();
  try {
    const M = await import('https://cdn.jsdelivr.net/npm/@echogarden/espeak-ng-emscripten@0.3.5/+esm');
    postMessage({ stage: 'import', ms: Date.now() - t0 });
    const m = await (M.default || M)();
    postMessage({ stage: 'init', ms: Date.now() - t0 });
    const w2 = new m.eSpeakNGWorker();
    w2.set_voice('en-us');
    const r = w2.synthesize_ipa('the quiet lantern hums beside the harbour');
    postMessage({ stage: 'IPA-OK', ms: Date.now() - t0, ipa: String(r.ipa).replace(/_+/g, '').replace(/\\s+/g, ' ').trim().slice(0, 70) });
    // AND the full pipeline in the SAME worker — the collision test that killed
    // the old package: model + new phonemizer sharing one worker.
    const T = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0');
    if (typeof SharedArrayBuffer === 'undefined') T.env.backends.onnx.wasm.numThreads = 1;
    const model = await T.StyleTextToSpeech2Model.from_pretrained('onnx-community/kitten-tts-nano-0.1-ONNX', { dtype: 'q8' });
    postMessage({ stage: 'model-beside-espeak-OK', ms: Date.now() - t0 });
    const tok = await T.AutoTokenizer.from_pretrained('onnx-community/kitten-tts-nano-0.1-ONNX');
    const styleR = await fetch('https://huggingface.co/onnx-community/kitten-tts-nano-0.1-ONNX/resolve/main/voices/expr-voice-2-f.bin');
    const style = new Float32Array(await styleR.arrayBuffer());
    const ph = String(w2.synthesize_ipa('the quiet lantern hums beside the harbour').ipa).replace(/_+/g, '').replace(/\\s+/g, ' ').trim();
    const { input_ids } = tok(ph, { truncation: true });
    const t1 = Date.now();
    const outp = await model({ input_ids, style: new T.Tensor('float32', style, [1, 256]), speed: new T.Tensor('float32', [1.0], [1]) });
    const wf = outp && outp.waveform;
    let peak = 0; const d = wf ? wf.data : [];
    for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; }
    postMessage({ stage: 'SYNTH-OK', synthMs: Date.now() - t1, sec: +(d.length / 24000).toFixed(2), peak: +peak.toFixed(3), totalMs: Date.now() - t0 });
  } catch (e) { postMessage({ stage: 'FAIL', name: e && e.name, msg: String((e && e.message) || e).slice(0, 160) }); }
`], { type: 'text/javascript' })), { type: 'module' });
w.onmessage = (e) => log({ ev: 'p6', ...e.data });
w.onerror = (e) => log({ ev: 'p6', stage: 'workererror', m: e.message || '' });
</script>
