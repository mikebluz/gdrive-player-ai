<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice check</title>
<style>body{font:15px -apple-system,sans-serif;background:#111;color:#dfd;padding:14px}pre{white-space:pre-wrap;word-break:break-all}.big{font-size:1.2em;color:#ffd75e}</style>
<h3>Bloops voice check — the real voice engine, on this device.</h3>
<div class="big" id="verdict">running…</div><pre id="out"></pre>
<script type="module">
const out = document.getElementById('out'), verdict = document.getElementById('verdict');
const log = (o) => { out.textContent += JSON.stringify(o) + '\n';
  fetch('http://' + location.hostname + ':3002/log', { method: 'POST', mode: 'cors',
    headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t: Date.now(), ...o }) }).catch(() => {}); };
log({ ev: 'boot7', ua: navigator.userAgent.slice(-55) });
const t0 = performance.now();
const w = new Worker('js/bloops/learn-voice.worker.js', { type: 'module' });
w.onmessage = (e) => {
  const d = e.data || {};
  if (d.audio) {
    const sec = +(d.audio.length / d.sampling_rate).toFixed(2);
    log({ ev: 'p7', stage: 'SYNTH-OK', sec, synthMs: d.ms, at: Math.round((performance.now() - t0) / 100) / 10 });
    verdict.textContent = '✅ The voice works on this device — ' + sec + 's of speech in ' + Math.round(d.ms / 1000) + 's. You can close this.';
    // play it, so ears confirm too
    try { const ac = new (window.AudioContext || window.webkitAudioContext)();
      const b = ac.createBuffer(1, d.audio.length, d.sampling_rate); b.getChannelData(0).set(d.audio);
      const src = ac.createBufferSource(); src.buffer = b; src.connect(ac.destination); src.start(); } catch (e2) {}
    return;
  }
  if (Number.isFinite(d.dl)) { verdict.textContent = 'downloading the voice… ' + d.dl + '%'; return; }
  log({ ev: 'p7', stage: 'msg', d: { ...d, audio: undefined } });
  if (d.warm) { verdict.textContent = 'voice loaded — speaking a test line…';
    w.postMessage({ id: 2, text: 'The quiet lantern hums beside the harbour.', voice: '' }); }
  if (d.error) verdict.textContent = '❌ failed: ' + d.error;
};
w.onerror = (e) => { log({ ev: 'p7', stage: 'workererror', m: e.message || '' }); verdict.textContent = '❌ worker error: ' + (e.message || ''); };
w.postMessage({ id: 1, warm: true });
</script>
