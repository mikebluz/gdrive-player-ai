<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mike Luz — A / instrument</title>
<style>
/* ── DIRECTION A: THE PAGE IS AN INSTRUMENT ───────────────────────────────
   The site generates music on arrival and the type is driven by what is
   sounding. Self-contained WebAudio here rather than the whole Bloops stack —
   enough to judge the IDEA. If this is the direction, the real version runs
   Bloops proper and inherits every generator you have already built. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#04040a;--txt:#f2f2f8;--ac:#9f7aea}
body{background:var(--ink);color:var(--txt);min-height:100svh;overflow:hidden;
  font-family:'Inter',-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.devbar{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;gap:14px;justify-content:center;
  padding:7px;font-size:.74rem;color:#8a8aa8;background:rgba(4,4,10,.7);backdrop-filter:blur(8px)}
.devbar a{color:#f6ad55}
.stage{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;
  justify-content:center;padding:0 clamp(20px,6vw,90px)}
.who{font-size:.76rem;letter-spacing:.42em;text-transform:uppercase;color:#7a7a9c;margin-bottom:26px}
/* Each letter is its own element so the audio can move them independently. */
.title{font-size:clamp(3.4rem,15vw,11rem);font-weight:800;letter-spacing:-.04em;line-height:.85;
  display:flex;flex-wrap:wrap;margin-bottom:8px}
.title span{display:inline-block;will-change:transform,opacity}
.sub{font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ac);margin-bottom:38px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.b{padding:13px 24px;border-radius:999px;border:1px solid #2a2a40;color:var(--txt);
  text-decoration:none;font-size:.9rem;font-weight:600;transition:.2s}
.b:hover{border-color:var(--ac);background:rgba(159,122,234,.12)}
.b1{background:var(--ac);border-color:var(--ac);color:#12081c}
.hint{position:fixed;left:0;right:0;bottom:22px;z-index:3;text-align:center;
  font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:#5a5a78}
.hint b{color:var(--ac);font-weight:700}
/* Full-bleed invitation to start — browsers will not make sound uninvited. */
.gate{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:rgba(4,4,10,.94);
  cursor:pointer;text-align:center;padding:24px}
.gate div{font-size:clamp(1rem,2.6vw,1.5rem);font-weight:600;letter-spacing:.02em}
.gate small{display:block;margin-top:14px;font-size:.78rem;letter-spacing:.24em;
  text-transform:uppercase;color:#6b6b85}
.gate .pulse{width:78px;height:78px;border-radius:50%;border:1px solid var(--ac);margin:0 auto 26px;
  display:grid;place-items:center;color:var(--ac);font-size:1.5rem;animation:p 2.4s ease-in-out infinite}
@keyframes p{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.08);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="devbar"><span>Direction <b>A</b> — the page is an instrument</span><a href="index.html">← old site</a> <a href="home-demos.html">all eight</a></div>
<canvas id="c"></canvas>

<div class="stage">
  <div class="who">Mike Luz</div>
  <h1 class="title" id="t"></h1>
  <div class="sub">New single</div>
  <div class="row">
    <a class="b b1" href="https://symphony.to/mercywizard/bhu4vkjnrcyg" target="_blank" rel="noopener">▸ Listen</a>
    <a class="b" href="https://youtu.be/UKcZJ31ZHH0" target="_blank" rel="noopener">Watch the video</a>
  </div>
</div>
<div class="hint">press <b>space</b> to change what you're hearing · <b>m</b> to mute</div>

<div class="gate" id="gate">
  <div>
    <div class="pulse">♪</div>
    Mike Luz
    <small>tap anywhere — the site plays itself</small>
  </div>
</div>

<script>
// ── TITLE ────────────────────────────────────────────────────────────────
const TITLE = 'GRAINS';
const t = document.getElementById('t');
[...TITLE].forEach(ch => { const s = document.createElement('span'); s.textContent = ch; t.appendChild(s); });
const letters = [...t.children];

// ── A SMALL GENERATIVE PATCH ─────────────────────────────────────────────
// Pad + arpeggio over a seeded scale, re-rolling its own material every few
// bars. Deliberately minimal: this is a demo of the concept, and the real
// version would drive it from Bloops instead.
let ctx, master, analyser, data, playing = false, timer = null, seed = 7;
const SCALES = [[0,2,3,5,7,8,10],[0,2,4,7,9],[0,3,5,6,7,10],[0,1,5,7,8]];
let scale = SCALES[0], root = 50;
const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);

function voice(midi, at, dur, gain, type) {
  const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
  o.type = type || 'sine'; o.frequency.value = hz(midi);
  f.type = 'lowpass'; f.frequency.value = 900 + rnd() * 2200; f.Q.value = 1;
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(gain, at + dur * 0.25);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(f); f.connect(g); g.connect(master);
  o.start(at); o.stop(at + dur + 0.05);
}
function bar() {
  if (!playing) return;
  const now = ctx.currentTime + 0.06;
  // pad — a held chord from the scale
  const deg = [0, 2, 4].map(i => root + scale[(i + Math.floor(rnd() * scale.length)) % scale.length]);
  deg.forEach((m, i) => voice(m - 12, now, 5.5, 0.05, 'sawtooth'));
  // arpeggio — eight notes across the bar
  for (let i = 0; i < 8; i++) {
    if (rnd() < 0.25) continue;                       // rests keep it from marching
    const m = root + 12 + scale[Math.floor(rnd() * scale.length)] + (rnd() < 0.3 ? 12 : 0);
    voice(m, now + i * 0.31, 0.5 + rnd() * 0.5, 0.055, 'triangle');
  }
  timer = setTimeout(bar, 2500);
}
function reroll() {
  scale = SCALES[Math.floor(Math.random() * SCALES.length)];
  root = 45 + Math.floor(Math.random() * 8);
  seed = (Math.random() * 1e9) | 0;
}

// ── VISUALS DRIVEN BY THE AUDIO ──────────────────────────────────────────
const cv = document.getElementById('c'), cx = cv.getContext('2d');
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener('resize', size); size();

function frame() {
  requestAnimationFrame(frame);
  cx.clearRect(0, 0, cv.width, cv.height);
  if (!analyser) return;
  analyser.getByteFrequencyData(data);
  const W = cv.width, H = cv.height, N = 64;
  // a soft spectrum ribbon across the middle
  cx.beginPath();
  for (let i = 0; i < N; i++) {
    const v = data[i * 2] / 255;
    const x = (i / (N - 1)) * W, y = H * 0.5 - v * H * 0.22;
    i ? cx.lineTo(x, y) : cx.moveTo(x, y);
  }
  for (let i = N - 1; i >= 0; i--) {
    const v = data[i * 2] / 255;
    cx.lineTo((i / (N - 1)) * W, H * 0.5 + v * H * 0.22);
  }
  cx.closePath();
  const g = cx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, 'rgba(159,122,234,.16)'); g.addColorStop(.5, 'rgba(79,209,197,.13)'); g.addColorStop(1, 'rgba(246,173,85,.12)');
  cx.fillStyle = g; cx.fill();
  // the title breathes with the low end
  const bass = (data[2] + data[4] + data[6]) / 765;
  letters.forEach((el, i) => {
    const v = data[6 + i * 5] / 255;
    el.style.transform = `translateY(${(-v * 16).toFixed(2)}px) scaleY(${(1 + bass * .06).toFixed(3)})`;
    el.style.opacity = (0.72 + v * 0.28).toFixed(2);
  });
}
frame();

// ── START / CONTROLS ─────────────────────────────────────────────────────
function start() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = 0.9;
  analyser = ctx.createAnalyser(); analyser.fftSize = 512;
  data = new Uint8Array(analyser.frequencyBinCount);
  master.connect(analyser); analyser.connect(ctx.destination);
  playing = true; bar();
  document.getElementById('gate').remove();
}
document.getElementById('gate').addEventListener('click', start);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); ctx ? reroll() : start(); }
  if (e.key === 'm' && master) master.gain.value = master.gain.value > 0 ? 0 : 0.9;
});
</script>
</body>
</html>
