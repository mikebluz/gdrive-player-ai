<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mike Luz — C / hand-made</title>
<style>
/* ── DIRECTION C: HAND-MADE ───────────────────────────────────────────────
   Built out of things you already made — the drawn Mercy Wizard wordmark and
   the Air Bath artwork — laid out like a zine page rather than a website.
   Paper grain, tape, everything a degree or two off true. Nothing is
   centred, because nothing glued down by hand ever is. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#e8e2d4;--ink:#16130f;--red:#c8352b;--blue:#2b4c9b}
body{background:#0f0d0b;color:var(--ink);min-height:100svh;
  font-family:'Courier New',Courier,monospace;overflow-x:hidden;
  padding:0 0 60px}
.devbar{padding:6px 14px;background:#16130f;color:#8a8478;font-size:12px;
  display:flex;gap:16px;flex-wrap:wrap;font-family:system-ui,sans-serif}
.devbar a{color:#f6ad55}
/* THE SHEET — a torn-ish page of paper on a dark table. */
.sheet{position:relative;max-width:940px;margin:26px auto;padding:clamp(26px,5vw,58px);
  background:var(--paper);
  /* grain, without shipping a texture file */
  background-image:
    radial-gradient(circle at 20% 30%,rgba(0,0,0,.05) 0 1px,transparent 1px),
    radial-gradient(circle at 70% 60%,rgba(0,0,0,.045) 0 1px,transparent 1px),
    radial-gradient(circle at 45% 85%,rgba(0,0,0,.04) 0 1px,transparent 1px);
  background-size:7px 7px,11px 11px,13px 13px;
  box-shadow:0 30px 70px rgba(0,0,0,.6);
  transform:rotate(-.4deg)}
.sheet::after{content:'';position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
  background:linear-gradient(112deg,rgba(0,0,0,.06),transparent 30%,rgba(0,0,0,.05))}
/* TAPE */
.tape{position:absolute;width:118px;height:34px;background:rgba(226,214,178,.72);
  box-shadow:0 1px 3px rgba(0,0,0,.25);border-left:1px dashed rgba(0,0,0,.12);
  border-right:1px dashed rgba(0,0,0,.12)}
.tape.t1{top:-15px;left:9%;transform:rotate(-6deg)}
.tape.t2{top:-13px;right:12%;transform:rotate(5deg)}
.tape.t3{bottom:-14px;left:38%;transform:rotate(2.5deg)}

.stamp{display:inline-block;border:2.5px solid var(--red);color:var(--red);
  padding:5px 12px;font-weight:700;letter-spacing:.18em;font-size:.76rem;
  transform:rotate(-3.5deg);margin-bottom:20px;opacity:.86}
.mark{max-width:min(440px,80%);margin:0 0 6px -6px;mix-blend-mode:multiply;
  transform:rotate(.8deg)}
.byline{font-size:.82rem;letter-spacing:.28em;text-transform:uppercase;color:#5c554a;
  margin:0 0 30px 4px}
/* CUT-OUT TITLE — each letter its own scrap, none quite aligned. */
.cut{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 22px -3px}
.cut span{display:inline-block;background:var(--ink);color:var(--paper);
  padding:2px 11px 5px;font-size:clamp(2.2rem,9vw,4.6rem);font-weight:700;
  font-family:Georgia,'Times New Roman',serif;line-height:1}
.cut span:nth-child(2n){transform:rotate(2deg) translateY(-3px);background:#241f18}
.cut span:nth-child(3n){transform:rotate(-2.4deg) translateY(2px)}
.cut span:nth-child(5n){background:var(--red)}
.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:clamp(18px,3vw,34px);align-items:start;margin-top:8px}
.vid{position:relative;border:1px solid rgba(0,0,0,.5);box-shadow:5px 6px 0 rgba(0,0,0,.75);
  transform:rotate(-1.1deg);background:#000}
.vid button{display:block;position:relative;width:100%;padding:56.25% 0 0;border:0;background:#000;cursor:pointer}
.vid img,.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.vid button::after{content:'▶';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:62px;height:62px;border-radius:50%;background:var(--paper);color:var(--ink);
  display:grid;place-items:center;font-size:1.2rem;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.side p{font-size:.94rem;line-height:1.6;color:#3a342c;margin-bottom:16px}
.scrawl{display:inline-block;font-size:1.15rem;font-weight:700;color:var(--blue);
  text-decoration:none;border-bottom:3px solid var(--blue);padding-bottom:1px;
  margin:0 14px 12px 0;transform:rotate(-.8deg)}
.scrawl:hover{color:var(--red);border-color:var(--red)}
.art{margin-top:34px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.art img{width:132px;border:6px solid #fff;box-shadow:3px 4px 0 rgba(0,0,0,.6)}
.art img:nth-child(2){transform:rotate(2.4deg)}
.art img:nth-child(3){transform:rotate(-3deg)}
.note{font-family:Georgia,serif;font-style:italic;color:#6b6255;font-size:.9rem;
  transform:rotate(-1deg);max-width:20ch}
@media(max-width:760px){.grid{grid-template-columns:1fr}.sheet{margin:14px 10px;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="devbar"><span>Direction <b>C</b> — hand-made</span><a href="index.html">← old site</a><a href="home-demos.html">all eight</a></div>

<div class="sheet">
  <div class="tape t1"></div><div class="tape t2"></div><div class="tape t3"></div>

  <div class="stamp">NEW SINGLE</div>
  <img class="mark" src="banner.jpg" alt="Mercy Wizard" />
  <div class="byline">a mike luz production</div>

  <div class="cut" id="cut"></div>

  <div class="grid">
    <div class="vid" id="vid"></div>
    <div class="side">
      <p>Out now, everywhere.</p>
      <a class="scrawl" href="https://symphony.to/mercywizard/bhu4vkjnrcyg" target="_blank" rel="noopener">listen →</a>
      <a class="scrawl" href="https://youtu.be/UKcZJ31ZHH0" target="_blank" rel="noopener">watch →</a>
      <div class="note">“the records, the instruments and the objects are all the same instinct”</div>
    </div>
  </div>

  <div class="art">
    <img src="artwork/Air Bath 2.png" alt="" />
    <img src="artwork/AirBath Drawing 3.png" alt="" />
    <img src="artwork/AirBath-NES-Cartridge-Final.png" alt="" />
  </div>
</div>

<script>
const YT = 'UKcZJ31ZHH0';
[...'GRAINS'].forEach(ch => { const s = document.createElement('span'); s.textContent = ch; document.getElementById('cut').appendChild(s); });
const v = document.getElementById('vid');
v.innerHTML = '<button type="button" aria-label="Play Grains"><img src="https://i.ytimg.com/vi/' + YT + '/maxresdefault.jpg" alt="" onerror="this.src=\'https://i.ytimg.com/vi/' + YT + '/hqdefault.jpg\'"></button>';
v.querySelector('button').addEventListener('click', function () {
  const d = document.createElement('div');
  d.style.cssText = 'position:relative;padding:56.25% 0 0';
  d.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + YT + '?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen title="Grains"></iframe>';
  this.replaceWith(d);
});
</script>
</body>
</html>
