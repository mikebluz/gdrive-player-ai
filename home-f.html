<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mike Luz — F / gig poster</title>
<style>
/* ── DIRECTION F: GIG POSTER ──────────────────────────────────────────────
   A screen-printed show bill. Two inks that overprint where they cross
   (multiply blend), halftone dots, condensed type stacked and rotated, a
   heavy rule box around everything. Where D is stark Helvetica minimalism,
   this is loud and ornamental — it wants to be stapled to a telephone pole. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f3ead7;--ink:#141018;--red:#e8321e;--blue:#1d3fbf}
body{background:#241f1a;color:var(--ink);min-height:100svh;overflow-x:hidden;
  font-family:'Haettenschweiler','Arial Narrow',Impact,sans-serif;padding:0 0 40px}
.devbar{padding:6px 14px;background:#141018;color:#8a8478;font-size:12px;display:flex;gap:16px;
  flex-wrap:wrap;font-family:system-ui,sans-serif}
.devbar a{color:#f6ad55}
.bill{position:relative;max-width:820px;margin:24px auto;background:var(--paper);
  padding:clamp(16px,3.2vw,30px);box-shadow:0 26px 60px rgba(0,0,0,.6);overflow:hidden}
/* halftone — a dot screen over the whole sheet */
.bill::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.16;
  background-image:radial-gradient(circle,#141018 .9px,transparent 1px);
  background-size:4px 4px;mix-blend-mode:multiply}
.frame{border:5px solid var(--ink);padding:clamp(14px,2.6vw,26px);position:relative}
.frame::before{content:'';position:absolute;inset:6px;border:1.5px solid var(--ink);pointer-events:none}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
  font-size:clamp(.8rem,1.9vw,1.05rem);letter-spacing:.22em;text-transform:uppercase;
  font-family:'Arial Narrow',sans-serif;font-weight:700;margin-bottom:10px}
.top .r{color:var(--red)}
.rule{height:4px;background:var(--ink);margin:8px 0 14px}
.rule.thin{height:2px;margin:12px 0}

.pres{text-align:center;font-size:clamp(.9rem,2.3vw,1.3rem);letter-spacing:.36em;
  text-transform:uppercase;font-family:'Arial Narrow',sans-serif;font-weight:700;margin-bottom:6px}
/* THE NAME — two inks, offset, overprinting where they meet. */
.name{position:relative;text-align:center;line-height:.82;margin:2px 0 6px}
.name .l{display:block;font-size:clamp(3.2rem,15.5vw,8.4rem);text-transform:uppercase;
  letter-spacing:-.01em;mix-blend-mode:multiply}
.name .l1{color:var(--red);transform:translateX(-3px)}
.name .l2{color:var(--blue);margin-top:-.14em;transform:translateX(3px)}
.sub{text-align:center;font-size:clamp(1rem,3.1vw,1.7rem);letter-spacing:.2em;text-transform:uppercase;
  font-family:'Arial Narrow',sans-serif;font-weight:700;color:var(--ink)}
.star{color:var(--red)}

.mid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2.4vw,22px);align-items:center;margin:16px 0}
.cut{border:4px solid var(--ink);position:relative;background:#000;filter:grayscale(1) contrast(1.35)}
.cut button{display:block;position:relative;width:100%;padding:56.25% 0 0;border:0;background:#000;cursor:pointer}
.cut img,.cut iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.cut button::after{content:'▶';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:56px;height:56px;background:var(--red);color:var(--paper);display:grid;place-items:center;
  font-size:1.2rem;border:3px solid var(--ink)}
.bullets{font-family:'Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;
  font-size:clamp(.92rem,2.2vw,1.18rem);line-height:1.5;letter-spacing:.05em}
.bullets li{list-style:none;border-bottom:2px solid var(--ink);padding:7px 0}
.bullets a{color:var(--ink);text-decoration:none}
.bullets a:hover{color:var(--red)}
.bullets span{color:var(--blue)}

.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  font-family:'Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;
  font-size:clamp(.72rem,1.7vw,.92rem);letter-spacing:.18em;margin-top:12px}
.foot a{color:var(--ink);text-decoration:none}
.foot a:hover{color:var(--blue)}
@media(max-width:640px){.mid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="devbar"><span>Direction <b>F</b> — gig poster</span><a href="index.html">← old site</a><a href="home-demos.html">all eight</a></div>

<div class="bill">
 <div class="frame">
  <div class="top"><span>MMXXVI</span><span class="r">★ NEW RELEASE ★</span><span>NO. 001</span></div>
  <div class="rule"></div>

  <div class="pres">A Mike Luz Production</div>
  <div class="name">
    <span class="l l1">Mercy</span>
    <span class="l l2">Wizard</span>
  </div>
  <div class="rule thin"></div>
  <div class="sub"><span class="star">★</span> Grains <span class="star">★</span> Out Now <span class="star">★</span></div>
  <div class="rule thin"></div>

  <div class="mid">
    <div class="cut" id="cut"></div>
    <ul class="bullets">
      <li><a href="https://symphony.to/mercywizard/bhu4vkjnrcyg" target="_blank" rel="noopener">Listen <span>▸</span></a></li>
      <li><a href="https://youtu.be/UKcZJ31ZHH0" target="_blank" rel="noopener">Watch <span>▸</span></a></li>
      <li><a href="bloops.html">Instruments <span>▸</span></a></li>
    </ul>
  </div>

  <div class="rule"></div>
  <div class="foot">
    <a href="https://instagram.com/mercywizard" target="_blank" rel="noopener">Instagram</a>
    <a href="https://www.youtube.com/@mercywizard-music" target="_blank" rel="noopener">YouTube</a>
    <a href="https://mercywizard.bandcamp.com" target="_blank" rel="noopener">Bandcamp</a>
  </div>
 </div>
</div>

<script>
const YT = 'UKcZJ31ZHH0';
const c = document.getElementById('cut');
c.innerHTML = '<button type="button" aria-label="Play Grains"><img src="https://i.ytimg.com/vi/' + YT + '/maxresdefault.jpg" alt="" onerror="this.src=\'https://i.ytimg.com/vi/' + YT + '/hqdefault.jpg\'"></button>';
c.querySelector('button').addEventListener('click', function () {
  const d = document.createElement('div');
  d.style.cssText = 'position:relative;padding:56.25% 0 0';
  d.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + YT + '?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen title="Grains"></iframe>';
  c.style.filter = 'none';       // drop the print treatment once it's actually playing
  this.replaceWith(d);
});
</script>
</body>
</html>
