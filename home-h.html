<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mike Luz — H / the page is a player</title>
<style>
/* ── DIRECTION H: THE PAGE IS A PLAYER ────────────────────────────────────
   The whole homepage is one piece of software — a chunky desktop media
   player with a title bar, an LCD, a spectrum, a playlist. Not a website
   ABOUT a musician who codes; a small application made by one. Everything
   in the playlist is real and clicking it goes somewhere. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--case:#2c2f38;--case2:#1b1d24;--lcd:#0d1f14;--lcd-fg:#5cffa8;--edge:#4a4f5c;--hi:#6d7484}
body{background:#0d0e12;color:#d6dae4;min-height:100svh;
  font:13px/1.5 'SF Mono',Menlo,Consolas,monospace;display:flex;flex-direction:column;
  align-items:center;padding:0 12px 40px;
  background-image:radial-gradient(60% 50% at 50% 0%,rgba(92,255,168,.06),transparent 70%)}
.devbar{align-self:stretch;padding:6px 14px;color:#7c8494;font-size:12px;display:flex;gap:16px;
  flex-wrap:wrap;font-family:system-ui,sans-serif;border-bottom:1px solid #1e212a;margin-bottom:26px}
.devbar a{color:#f6ad55}
/* THE UNIT — bevelled like a plastic box. */
.unit{width:100%;max-width:560px;background:linear-gradient(180deg,var(--case),var(--case2));
  border:1px solid var(--edge);border-radius:8px;
  box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 26px 60px rgba(0,0,0,.6);overflow:hidden}
.tb{display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:linear-gradient(180deg,#3a3f4b,#262a33);border-bottom:1px solid #12141a;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#aeb6c6}
.tb .dots{display:flex;gap:5px;margin-right:4px}
.tb i{width:10px;height:10px;border-radius:50%;background:#4d5361;box-shadow:0 1px 0 rgba(255,255,255,.15) inset}
.tb i:nth-child(1){background:#e0564a}.tb i:nth-child(2){background:#e2b04a}.tb i:nth-child(3){background:#5cc46b}
.body{padding:14px}
/* LCD */
.lcd{background:var(--lcd);border:1px solid #0a1610;border-radius:5px;padding:12px 14px;
  box-shadow:0 2px 10px rgba(0,0,0,.5) inset;color:var(--lcd-fg);
  text-shadow:0 0 7px rgba(92,255,168,.4);margin-bottom:12px;position:relative;overflow:hidden}
.lcd::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px,rgba(0,0,0,.16) 2px 3px)}
.lcd .l1{font-size:11px;letter-spacing:.2em;opacity:.72;margin-bottom:5px}
.lcd .l2{font-size:clamp(1.3rem,5.2vw,1.9rem);letter-spacing:.02em;font-weight:700;line-height:1.1}
.lcd .l3{font-size:11px;letter-spacing:.16em;opacity:.72;margin-top:6px;display:flex;justify-content:space-between;gap:10px}
/* SPECTRUM — animated bars; purely decorative until a real source drives it. */
.spec{display:flex;align-items:flex-end;gap:2px;height:42px;margin:10px 0 14px}
.spec b{flex:1;background:linear-gradient(180deg,var(--lcd-fg),#1c6c46);border-radius:1px;
  animation:eq 1.1s ease-in-out infinite;transform-origin:bottom}
@keyframes eq{0%,100%{height:14%}50%{height:96%}}
/* TRANSPORT */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{flex:0 0 auto;min-width:46px;height:40px;padding:0 13px;border-radius:5px;
  border:1px solid var(--edge);background:linear-gradient(180deg,#454b58,#2a2e37);
  color:#e3e8f2;font:inherit;font-size:13px;cursor:pointer;
  box-shadow:0 1px 0 rgba(255,255,255,.13) inset}
.btn:hover{background:linear-gradient(180deg,#525968,#333844)}
.btn:active{box-shadow:0 2px 6px rgba(0,0,0,.5) inset;transform:translateY(1px)}
.btn.p{background:linear-gradient(180deg,#5cffa8,#22b06d);color:#062015;border-color:#1d7d4d;font-weight:700}
.vol{flex:1;min-width:90px;height:5px;background:#171a21;border-radius:99px;position:relative;
  box-shadow:0 1px 3px rgba(0,0,0,.6) inset}
.vol i{position:absolute;left:0;top:0;bottom:0;width:72%;background:var(--lcd-fg);border-radius:99px}
/* PLAYLIST */
.pl{margin-top:14px;border:1px solid #12141a;border-radius:5px;background:#171a21;overflow:hidden}
.pl div{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid #12141a;cursor:pointer;
  color:#c3cad8;text-decoration:none;align-items:center}
.pl div:last-child{border-bottom:0}
.pl div:hover{background:#1f232c;color:#fff}
.pl .n{color:#6d7484;width:20px}
.pl .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .g{color:#5cffa8;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.pl .cur{background:#1c2a22;color:#eafff3}
.pl .cur .n{color:#5cffa8}
.hint{margin-top:16px;font-size:11px;color:#5b6272;letter-spacing:.1em;text-align:center}
/* VIDEO — opens inside the unit's screen. */
.scr{position:relative;padding:56.25% 0 0;background:#000;border-radius:5px;overflow:hidden;
  border:1px solid #0a1610;margin-bottom:12px;display:none}
.scr.on{display:block}
.scr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media(prefers-reduced-motion:reduce){.spec b{animation:none;height:40%}}
</style>
</head>
<body>
<div class="devbar"><span>Direction <b>H</b> — the page is a player</span><a href="index.html">← old site</a><a href="home-demos.html">all eight</a></div>

<div class="unit">
  <div class="tb"><span class="dots"><i></i><i></i><i></i></span> mikeluz.player — v1.0</div>
  <div class="body">
    <div class="scr" id="scr"></div>
    <div class="lcd">
      <div class="l1">▶ NOW PLAYING</div>
      <div class="l2" id="l2">GRAINS</div>
      <div class="l3"><span id="l3a">MERCY WIZARD</span><span>NEW SINGLE</span></div>
    </div>
    <div class="spec" id="spec"></div>
    <div class="row">
      <button class="btn p" id="play" type="button">▶ PLAY</button>
      <button class="btn" id="vid" type="button">▣ VIDEO</button>
      <span class="vol"><i></i></span>
    </div>

    <div class="pl" id="pl"></div>
    <div class="hint">everything in the list is real — click it</div>
  </div>
</div>

<script>
const YT = 'UKcZJ31ZHH0';
// Bars at staggered rates so the spectrum doesn't pulse in lockstep.
const spec = document.getElementById('spec');
for (let i = 0; i < 28; i++) {
  const b = document.createElement('b');
  b.style.animationDelay = (-Math.random() * 1.1).toFixed(2) + 's';
  b.style.animationDuration = (0.75 + Math.random() * 0.9).toFixed(2) + 's';
  spec.appendChild(b);
}

const LIST = [
  { t: 'Grains — new single',       g: 'listen', u: 'https://symphony.to/mercywizard/bhu4vkjnrcyg', cur: true },
  { t: 'Grains — official video',   g: 'watch',  v: true },
  { t: 'Bloops — generative instrument', g: 'app', u: 'bloops.html' },
  { t: 'Artwork',                   g: 'shop',   u: 'artwork.html' },
  { t: 'Merch',                     g: 'shop',   u: 'https://mercywizard.bandcamp.com/merch' },
  { t: 'Guitars',                   g: 'shop',   u: 'https://linktr.ee/mikebuys' },
  { t: 'Everything else',           g: 'links',  u: 'https://linktr.ee/mercywizard' },
];
const pl = document.getElementById('pl');
LIST.forEach((x, i) => {
  const d = document.createElement('div');
  if (x.cur) d.className = 'cur';
  d.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="t"></span><span class="g"></span>';
  d.querySelector('.t').textContent = x.t;
  d.querySelector('.g').textContent = x.g;
  d.addEventListener('click', () => x.v ? openVid() : open(x.u, /^https?:/.test(x.u) ? '_blank' : '_self', 'noopener'));
  pl.appendChild(d);
});

const scr = document.getElementById('scr');
function openVid() {
  scr.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + YT + '?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen title="Grains"></iframe>';
  scr.classList.add('on');
  document.getElementById('l3a').textContent = 'PLAYING VIDEO';
}
document.getElementById('vid').addEventListener('click', openVid);
document.getElementById('play').addEventListener('click', () =>
  open('https://symphony.to/mercywizard/bhu4vkjnrcyg', '_blank', 'noopener'));
</script>
</body>
</html>
