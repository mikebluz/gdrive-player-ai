<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mike Luz — I / archive</title>
<style>
/* ── DIRECTION I: ARCHIVE ─────────────────────────────────────────────────
   Not a hero page at all — an INDEX. Everything made, records and software
   in one table, because they are one body of work. Dense, dated, filterable.
   The bet: the impressive thing about you is the volume and the range, and a
   single-single hero page actively hides that. Ages perfectly: new work is a
   new row. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0c0c0f;--fg:#e4e4e9;--dim:#6e6e7e;--line:#1e1e26;--mus:#e8a33d;--sof:#4fd1c5}
body{background:var(--bg);color:var(--fg);min-height:100svh;
  font:13px/1.6 'SF Mono',Menlo,Consolas,monospace;padding:0 0 70px}
.devbar{padding:6px 14px;border-bottom:1px solid var(--line);color:var(--dim);font-size:12px;
  display:flex;gap:16px;flex-wrap:wrap;font-family:system-ui,sans-serif}
.devbar a{color:#f6ad55}
.wrap{max-width:1080px;margin:0 auto;padding:0 clamp(14px,3vw,26px)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
  padding:clamp(26px,5vw,52px) 0 16px;border-bottom:1px solid var(--fg)}
.head h1{font-size:clamp(1.1rem,2.6vw,1.4rem);font-weight:400;letter-spacing:.34em;text-transform:uppercase}
.head .c{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.f{padding:5px 12px;border:1px solid var(--line);background:transparent;color:var(--dim);
  font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.f:hover{color:var(--fg);border-color:#33333f}
.f.on{color:var(--bg);background:var(--fg);border-color:var(--fg)}
/* THE TABLE */
.hdr,.r{display:grid;grid-template-columns:52px 1fr 96px 88px 74px;gap:12px;align-items:baseline;
  padding:11px 4px;border-bottom:1px solid var(--line)}
.hdr{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  border-bottom-color:#2a2a34;position:sticky;top:0;background:var(--bg);z-index:2}
.r{text-decoration:none;color:inherit;cursor:pointer;transition:background .12s}
.r:hover{background:#14141a}
.r .n{color:var(--dim)}
.r .t{font-size:15px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.r[data-k="music"] .k{color:var(--mus)}
.r[data-k="software"] .k{color:var(--sof)}
.r .fm,.r .y{font-size:11px;color:var(--dim)}
.r .y{text-align:right}
.r.new .t::after{content:'NEW';margin-left:10px;font-size:9px;letter-spacing:.18em;
  color:var(--bg);background:var(--mus);padding:2px 6px;vertical-align:2px}
.foot{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:22px;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.foot a{color:var(--dim);text-decoration:none}
.foot a:hover{color:var(--fg)}
.count{padding:14px 4px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
@media(max-width:680px){
  .hdr{display:none}
  .r{grid-template-columns:34px 1fr auto;gap:8px}
  .r .fm{display:none}
  .r .k{grid-column:2;font-size:9px}
  .r .y{grid-row:1;grid-column:3}
}
</style>
</head>
<body>
<div class="devbar"><span>Direction <b>I</b> — archive</span><a href="index.html">← old site</a><a href="home-demos.html">all twelve</a></div>

<div class="wrap">
  <div class="head">
    <h1>Mike Luz</h1>
    <div class="c">Complete index · records &amp; instruments · MMXXVI</div>
  </div>

  <div class="filters">
    <button class="f on" data-f="all" type="button">All</button>
    <button class="f" data-f="music" type="button">Music</button>
    <button class="f" data-f="software" type="button">Software</button>
  </div>

  <div class="hdr"><span>№</span><span>Title</span><span>Kind</span><span>Format</span><span>Year</span></div>
  <div id="rows"></div>
  <div class="count" id="count"></div>

  <div class="foot">
    <a href="https://linktr.ee/mercywizard" target="_blank" rel="noopener">All links</a>
    <a href="https://www.youtube.com/@mercywizard-music" target="_blank" rel="noopener">YouTube</a>
    <a href="https://mercywizard.bandcamp.com" target="_blank" rel="noopener">Bandcamp</a>
    <span>Mercy Wizard</span>
  </div>
</div>

<script>
// One list. New work is a new row — the whole point of this direction.
const WORKS = [
  { t: 'Grains',   k: 'music',    f: 'Single',     y: 2026, u: 'https://symphony.to/mercywizard/bhu4vkjnrcyg', new: true },
  { t: 'Grains — official video', k: 'music', f: 'Video', y: 2026, u: 'https://youtu.be/UKcZJ31ZHH0' },
  { t: 'Bloops',   k: 'software', f: 'Instrument', y: 2026, u: 'bloops.html' },
  { t: 'Tracks',   k: 'software', f: 'Multitrack', y: 2026, u: 'tracks.html' },
  { t: 'Player',   k: 'software', f: 'Player',     y: 2025, u: 'player.html' },
  { t: 'Game',     k: 'software', f: 'Game',       y: 2025, u: 'game.html' },
  // …every release and every build goes here as it lands.
];

const rows = document.getElementById('rows'), count = document.getElementById('count');
let filter = 'all';

function draw() {
  const list = WORKS.filter(w => filter === 'all' || w.k === filter);
  rows.innerHTML = '';
  list.forEach((w, i) => {
    const a = document.createElement('a');
    a.className = 'r' + (w.new ? ' new' : '');
    a.dataset.k = w.k;
    a.href = w.u;
    if (/^https?:/.test(w.u)) { a.target = '_blank'; a.rel = 'noopener'; }
    a.innerHTML = '<span class="n">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<span class="t"></span><span class="k"></span><span class="fm"></span><span class="y">' + w.y + '</span>';
    a.querySelector('.t').textContent = w.t;
    a.querySelector('.k').textContent = w.k;
    a.querySelector('.fm').textContent = w.f;
    rows.appendChild(a);
  });
  count.textContent = list.length + ' of ' + WORKS.length + ' entries';
}
document.querySelectorAll('.f').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.f').forEach(x => x.classList.toggle('on', x === b));
  filter = b.dataset.f; draw();
}));
draw();
</script>
</body>
</html>
