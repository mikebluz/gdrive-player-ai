<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mike Luz</title>
  <meta name="description" content="Mike Luz — Mercy Wizard." />
  <link rel="stylesheet" href="css/site.css?v=DEPLOYVER" />
</head>
<body class="bare">

  <!-- ══ TEMPORARY — REMOVE WHEN THIS PAGE REPLACES index.html ══════════════
       The old homepage stays live and untouched while this one is built. -->
  <div class="devbar">
    <span><b>New site, in progress.</b> Nothing here is final.</span>
    <a href="index.html">← the current homepage</a>
  </div>
  <!-- ══ END TEMPORARY ═══════════════════════════════════════════════════════ -->

  <!-- Stripped to the bone on purpose: the name, the single, and nothing else.
       Everything that was here before — the three strands, the about, the
       footer — is in git if we want any of it back, but this is the canvas we
       are rebuilding from. -->
  <header class="hero hero-full">
    <div class="wrap hero-inner">
      <div>
        <div class="hero-kicker">Mike Luz</div>
        <div class="rel-tag" id="rel-tag">New single</div>
        <h1 id="rel-title">—</h1>
        <p class="rel-blurb" id="rel-blurb"></p>
        <div class="hero-cta">
          <a class="btn btn-primary" id="rel-stream" href="#" target="_blank" rel="noopener">▸ Listen</a>
          <a class="btn" id="rel-watch" href="#" target="_blank" rel="noopener">Watch the video</a>
        </div>
      </div>
      <div class="hero-art" id="rel-art"></div>
    </div>
  </header>

  <script>
    // ── THE CURRENT RELEASE ───────────────────────────────────────────────
    // The whole page. Change these when a new one lands.
    //   youtube: the video id → the art becomes a click-to-play player.
    //   art:     used instead when there is no video (a filename or URL).
    const SINGLE = {
      tag:     'New single',
      title:   'Grains',
      blurb:   '',   // one or two lines about the track. Empty = hidden.
      stream:  'https://symphony.to/mercywizard/bhu4vkjnrcyg',
      youtube: 'UKcZJ31ZHH0',
      art:     'me2026.jpg',
    };

    (function () {
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s == null ? '' : s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));

      $('rel-tag').textContent = SINGLE.tag || 'New single';
      $('rel-title').textContent = SINGLE.title || '';
      // An empty blurb collapses rather than leaving a gap where text should be.
      if (SINGLE.blurb) $('rel-blurb').textContent = SINGLE.blurb; else $('rel-blurb').remove();
      if (SINGLE.stream) $('rel-stream').href = SINGLE.stream; else $('rel-stream').remove();
      if (SINGLE.youtube) $('rel-watch').href = 'https://youtu.be/' + SINGLE.youtube; else $('rel-watch').remove();

      const art = $('rel-art');
      if (SINGLE.youtube) {
        // Click-to-play: a thumbnail until pressed, so the page carries no
        // YouTube player (or cookies) for a video nobody has asked for yet.
        art.innerHTML =
          '<button class="vframe vposter" type="button" aria-label="Play ' + esc(SINGLE.title) + '">' +
            '<img src="https://i.ytimg.com/vi/' + esc(SINGLE.youtube) + '/maxresdefault.jpg" alt="" ' +
            'onerror="this.src=\'https://i.ytimg.com/vi/' + esc(SINGLE.youtube) + '/hqdefault.jpg\'" />' +
          '</button>';
        art.querySelector('.vposter').addEventListener('click', function () {
          const d = document.createElement('div');
          d.className = 'vframe';
          d.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + esc(SINGLE.youtube) +
            '?autoplay=1&rel=0" title="' + esc(SINGLE.title) + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
          this.replaceWith(d);
        });
      } else if (SINGLE.art) {
        art.innerHTML = '<img src="' + esc(SINGLE.art) + '" alt="' + esc(SINGLE.title) + '" />';
      } else {
        art.remove();
      }
    })();
  </script>

</body>
</html>
